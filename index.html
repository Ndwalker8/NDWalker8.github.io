<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicholas Walker - Engineering Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="Logo.ico" sizes="256x256" type="image/x-icon">
  <style>
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #1c1c1c;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }
    .title {
      display: flex;
      align-items: center;
      font-size: 1.8rem;
      color: #76ABAE;
      font-family: "Monotype Baskerville", serif;
    }
    .title img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-right: 12px;
    }
    .navbar {
      display: flex;
      gap: 20px;
    }
    .navbar-link {
      color: #EEEEEE;
      text-decoration: none;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
    }
    .navbar-link:hover {
      color: #76ABAE;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .social-links img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      transition: transform 0.2s;
    }
    .social-links img:hover {
      transform: scale(1.1);
    }
    body {
      padding-top: 80px; /* Offset for fixed header */
    }
  </style>
</head>
<body>
  <header class="header" id="header">
    <div class="title">
      <img src="Logo.png" alt="Logo">
      Nicholas Walker
    </div>
    <nav class="navbar">
      <a href="#hero" class="navbar-link">Home</a>
      <a href="#about-me" class="navbar-link">About</a>
      <a href="Walker.Nicholas.pdf" class="navbar-link" target="_blank">Resume</a>
    </nav>
  </header>

  <section id="hero">
    <div class="container">
      <div class="hero-content">
        <h1>Nicholas Walker</h1>
        <img src="PPP3.jpg" alt="Profile Picture" class="hero-image">
        <p>Aerospace and Mechanical Engineer</p>
        <div class="social-links">
          <a href="mailto:ndwalker8@gmail.com"><img src="Gmail_Logo.webp" alt="Gmail"></a>
          <a href="https://www.linkedin.com/in/nicholaswalker8"><img src="LinkedIn_Logo.png" alt="LinkedIn"></a>
        </div>
        <div class="buttons">
          <a href="Walker.Nicholas.pdf" class="btn" target="_blank">Resume</a>
          <a href="#projects" class="btn">Key Projects</a>
          <a href="#about-me" class="btn">About Me</a>
        </div>
      </div>
    </div>
  </section>

  <!-- The rest of the content remains the same -->
  <!-- Education, Experience, Projects, About Me, Footer -->

  <footer>
    <p>&copy; 2024 Nicholas Walker</p>
  </footer>

  <script>
    window.addEventListener("scroll", function () {
      var header = document.getElementById("header");
      if (window.pageYOffset > 100) {
        header.classList.add("active");
      } else {
        header.classList.remove("active");
      }
    });
  </script>
</body>
</html>
